name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Prepare Fixed Signing Keystore
      run: |
        if [ ! -f "app/release.jks" ]; then
          echo "Generating permanent release.jks keystore..."
          keytool -genkeypair -v -keystore app/release.jks -alias redmi -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=SonDesigner, OU=Design, O=Son, L=HCM, S=HCM, C=VN"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/release.jks
          git commit -m "chore: persist fixed keystore for consistent auto-updates" || true
          git push origin main || true
        else
          echo "Permanent release.jks keystore already exists."
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RedmiCompanion-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 14
